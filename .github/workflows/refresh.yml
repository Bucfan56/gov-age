name: Refresh FEC data

# Campaign finance moves on quarterly filing deadlines, so weekly is plenty.
# The FEC regenerates bulk files nightly; daily just burns bandwidth.
on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  workflow_dispatch:        # Actions -> Refresh FEC data -> Run workflow

permissions:
  contents: write

concurrency:
  group: refresh-fec
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Historical cycles are immutable, so the cache is always safe for them.
      # The live cycle is re-pulled every run via --fresh-current.
      # First run has no cache and pulls ~600 MB; budget 15-25 minutes.
      - name: Restore FEC bulk cache
        uses: actions/cache@v4
        with:
          path: raw
          key: fec-bulk-${{ github.run_id }}
          restore-keys: |
            fec-bulk-

      # Congress changes between elections: members die, resign, are appointed
      # to fill vacancies, or win special elections. Re-deriving the roster each
      # week keeps the chamber medians honest. verify.py gates the commit, so a
      # bad upstream release fails the run rather than shipping.
      - name: Rebuild the congressional roster
        run: python3 build_roster.py --refresh

      - name: Rebuild finance.json
        run: python3 build_finance.py --roster roster_map.json --out finance.json --fresh-current

      - name: Re-inline into index.html
        run: python3 inline_data.py

      # Gate the commit on the smoke test: dataset shape, internal coherence,
      # known-good anchor figures, inlined copy matching finance.json, and the
      # page still having its charts, drawer, caveat box and data guards.
      - name: Verify
        run: python3 verify.py

      - name: Commit if the data moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- finance.json index.html roster_map.json; then
            echo "No change in FEC data or roster — nothing to commit."
            exit 0
          fi
          git add finance.json index.html roster_map.json
          git commit -m "Refresh FEC data and roster ($(date -u +%Y-%m-%d))"
          git push
