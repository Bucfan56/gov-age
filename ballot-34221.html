<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palmetto Ballot Report</title>
<meta name="description" content="Every race on the Nov 3, 2026 ballot for Palmetto, FL 34221: who funds each candidate, their record, and what was found.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea;--card:#fffdf8;--ink:#1d1b17;--sub:#6b665c;--line:#e4ddcf;--chip:#efe9dc;
  --good:#1f8a4c;--good-bg:#e3f4ea;--mid:#c27a07;--mid-bg:#fbefd6;--bad:#c0392b;--bad-bg:#f9e1dd;
  --none:#8b867c;--none-bg:#ecebe7;--amber:#a86a12;--amber-bg:#fff6e5;--accent:#2b4c7e;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(40,30,10,.07);--r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151a;--card:#1c1f26;--ink:#ecebe7;--sub:#9a9fab;--line:#2c313b;--chip:#262a33;
  --good:#3ccf7c;--good-bg:#173526;--mid:#f0a92e;--mid-bg:#3a2d12;--bad:#ff6b5b;--bad-bg:#3d1c19;
  --none:#8d929c;--none-bg:#272a31;--amber:#f0b44c;--amber-bg:#2f2614;--accent:#8fb3ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{
  --bg:#13151a;--card:#1c1f26;--ink:#ecebe7;--sub:#9a9fab;--line:#2c313b;--chip:#262a33;
  --good:#3ccf7c;--good-bg:#173526;--mid:#f0a92e;--mid-bg:#3a2d12;--bad:#ff6b5b;--bad-bg:#3d1c19;
  --none:#8d929c;--none-bg:#272a31;--amber:#f0b44c;--amber-bg:#2f2614;--accent:#8fb3ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{scrollbar-width:none;-webkit-text-size-adjust:100%}
html::-webkit-scrollbar,*::-webkit-scrollbar{display:none}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 64px}
header.top{display:flex;align-items:center;gap:12px;padding:18px 0 10px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--ink);display:grid;place-items:center;font-size:22px;flex:none}
.top h1{font-size:20px;margin:0;letter-spacing:-.01em;line-height:1.2}
.top p{margin:2px 0 0;color:var(--sub);font-size:13px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.pill:hover{border-color:var(--sub)}
.check{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:6px;box-shadow:var(--shadow)}
.check b{display:block}.check span{color:var(--sub);font-size:13px}
.check a{margin-left:auto;white-space:nowrap;font-weight:700;text-decoration:none;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px}
@media(max-width:480px){.check{flex-wrap:wrap}.check a{margin-left:0;width:100%;text-align:center}}
h2.grp{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);margin:22px 2px 10px;display:flex;gap:8px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:980px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:118px;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile .t{font-weight:700;font-size:16px;line-height:1.2}
.tile .s{color:var(--sub);font-size:13px}
.tile .dots{display:flex;gap:5px;margin-top:auto;flex-wrap:wrap}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--sub)}
.tag.addr{background:var(--amber-bg);color:var(--amber)}
.g{background:var(--good)}.m{background:var(--mid)}.b{background:var(--bad)}.n{background:var(--none)}
.bar{display:flex;align-items:center;gap:10px;padding:14px 0 8px;position:sticky;top:0;background:var(--bg);z-index:5}
.backbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;font-weight:700;cursor:pointer;white-space:nowrap}
.bar h1{font-size:19px;margin:0;line-height:1.2}
.lead{color:var(--sub);margin:4px 0 14px;font-size:14px;max-width:760px}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1000px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.flip{perspective:1400px;cursor:pointer;outline:none}
.flip .in{position:relative;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.flip .in{transition:none}}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--none);min-width:0}
.face.back{transform:rotateY(180deg);position:absolute;top:0;left:0;width:100%}
.flip.on .face.front{position:absolute;top:0;left:0;width:100%}.flip.on .face.back{position:relative}
.flip:not(.on) .face.back,.flip.on .face.front{pointer-events:none}
.flip:focus-visible .face{outline:3px solid var(--accent);outline-offset:2px}
.fg{border-top-color:var(--good)}.fm{border-top-color:var(--mid)}.fb{border-top-color:var(--bad)}
.who{display:flex;gap:12px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;flex:none}
.who .nm{font-weight:800;font-size:17px;line-height:1.2}
.who .pt{color:var(--sub);font-size:13px}
.rank{margin-left:auto;align-self:flex-start;font-size:12px;font-weight:800;color:var(--sub);text-align:right;white-space:nowrap}
.big{display:flex;align-items:center;gap:14px;border-radius:14px;padding:10px 12px}
.big .num{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.03em;min-width:54px}
.big .word{font-weight:800;font-size:15px}.big .hint{font-size:12px;color:var(--sub)}
.bg-g{background:var(--good-bg)}.bg-g .num,.bg-g .word{color:var(--good)}
.bg-m{background:var(--mid-bg)}.bg-m .num,.bg-m .word{color:var(--mid)}
.bg-b{background:var(--bad-bg)}.bg-b .num,.bg-b .word{color:var(--bad)}
.bg-n{background:var(--none-bg)}.bg-n .num,.bg-n .word{color:var(--none)}
.meter{display:grid;grid-template-columns:122px minmax(0,1fr) 30px;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.meter .lb{font-weight:600;white-space:nowrap}
.meter .tr{height:9px;border-radius:9px;background:var(--chip);overflow:hidden}
.meter .fl{display:block;height:100%;border-radius:9px}
.meter .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.blurb{font-size:13.5px;color:var(--sub);margin:0}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badges:empty{display:none}
.bdg{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--chip)}
.bdg.src{background:var(--amber-bg);color:var(--amber)}
.bdg.flag{background:var(--bad-bg);color:var(--bad)}
.hintline{margin-top:auto;font-size:12px;color:var(--sub)}
.btn{border:0;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink)}
.bk{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--sub);font-weight:800}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kv div{background:var(--chip);border-radius:10px;padding:8px}
.kv b{display:block;font-size:16px}.kv span{font-size:11px;color:var(--sub)}
ol.top3{margin:2px 0 0;padding-left:18px;font-size:13.5px}
ol.top3 li{margin:2px 0}
.mini{font-size:13.5px;margin:0}
.muted{color:var(--sub)}
.st{font-size:10.5px;font-weight:800;text-transform:uppercase;padding:2px 6px;border-radius:6px;margin-right:5px;background:var(--chip);color:var(--sub)}
.st.allegation{background:var(--mid-bg);color:var(--mid)}.st.established{background:var(--bad-bg);color:var(--bad)}
.st.dismissed,.st.resolved{background:var(--good-bg);color:var(--good)}.st.fact-checked{color:var(--accent)}
.row2{display:flex;gap:8px;margin-top:auto}
.row2 .btn{flex:1}.row2 .btn.ghost{flex:0 0 52px}
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.open{display:block}
.sheet .sc{position:absolute;inset:0;background:rgba(10,10,12,.5)}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding:0 16px 40px;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
@media(min-width:760px){.sheet .pn{left:50%;top:4vh;bottom:4vh;transform:translateX(-50%);width:720px;border-radius:22px;max-height:none}}
.pn .ph{position:sticky;top:0;background:var(--bg);padding:16px 0 10px;display:flex;align-items:center;gap:10px;z-index:2}
.pn .ph h2{margin:0;font-size:19px;flex:1;line-height:1.2}
.x{border:0;background:var(--chip);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:0 14px}
details[open]{padding-bottom:12px}
summary{cursor:pointer;font-weight:700;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--sub)}
details[open] summary::after{content:"－"}
details ul{margin:0;padding-left:18px}details li{margin:7px 0;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.r{text-align:right;white-space:nowrap;font-weight:700}
.own{background:var(--amber-bg);border:2px dashed var(--amber);border-radius:14px;padding:12px 14px;margin:10px 0}
.own h4{margin:0 0 4px;color:var(--amber)}
.own .it{margin:10px 0 0;font-size:14px}
.own .meta{font-size:12px;color:var(--sub)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px}
.panel h4{margin:0 0 6px}
.formula{font-size:14px;margin:6px 0;padding-left:18px}.formula li{margin:5px 0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.mcard h3{margin:0 0 6px;font-size:17px}
.sides{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:10px}
@media(min-width:700px){.sides{grid-template-columns:repeat(2,minmax(0,1fr))}}
.side{border-radius:12px;padding:10px 12px;background:var(--chip);font-size:14px}
.side h4{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.side div{margin:4px 0}
footer{color:var(--sub);font-size:12.5px;margin-top:36px;text-align:center}
body.locked{overflow:hidden}
.newpage{display:block;text-decoration:none;color:var(--ink);background:var(--amber-bg);border:2px solid var(--amber);border-radius:14px;padding:12px 14px;margin:0 0 12px;font-size:14.5px}
/* ---------- Voting today ---------- */
.vote{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin:4px 0 14px;border-left:6px solid #b22234}
.vh{display:flex;gap:12px;align-items:center}
.vh .vi{font-size:30px;line-height:1}
.vh b{display:block;font-size:17px;line-height:1.25}
.vh span{color:var(--sub);font-size:13.5px;font-weight:600}
.vh span.open{color:var(--good)}.vh span.closed{color:var(--bad)}
.vote ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.vote li{font-size:14px;display:flex;gap:10px;align-items:flex-start}
.vote li i{font-style:normal;flex:none;width:22px;text-align:center}
.vbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.vbtns a{display:block;text-align:center;text-decoration:none;font-weight:800;padding:12px 10px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14.5px}
.vbtns a.alt{background:var(--chip);color:var(--ink)}
.zip{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.zip label{font-size:13px;font-weight:700;color:var(--sub)}
.zip input{flex:1;min-width:110px;max-width:160px;font:inherit;font-size:16px;font-weight:700;letter-spacing:.08em;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
.zip input:focus{border-color:var(--accent)}
.zipout{font-size:13.5px;margin:8px 0 0;min-height:1em}
.zipout:empty{display:none}
/* ---------- Deck picker ---------- */
.decks{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 6px;scroll-snap-type:x proximity}
.dk{flex:none;scroll-snap-align:start;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 12px 6px 6px;display:flex;gap:8px;align-items:center;font-weight:700;font-size:13.5px;cursor:pointer}
.dk[aria-pressed="true"]{border-color:var(--ink)}
.dk .sw{width:30px;height:30px;border-radius:9px;flex:none}
.sw-flag{background:linear-gradient(#0a3161 0 45%,transparent 45%),repeating-linear-gradient(#b22234 0 4px,#fff 4px 8px)}
.sw-sun{background:linear-gradient(160deg,#ffb347,#ff5e62 50%,#12a4b6)}
.sw-marble{background:linear-gradient(135deg,#f6f1e7,#e2d8c3);box-shadow:inset 0 0 0 3px #b8962e}
.sw-button{background:radial-gradient(circle,#fff 0 34%,#0a3161 35% 52%,#b22234 53%)}
.sw-holo{background:conic-gradient(from 30deg,#7af,#f7a,#ff7,#7fa,#7af)}
.deckhint{font-size:12.5px;color:var(--sub);margin:0 2px 10px}
/* ---------- Card front: shared layout ---------- */
.face.front{padding:0;gap:0;overflow:hidden}
.art{position:relative;aspect-ratio:5/4;background:#0a3161;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.mono{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:800;color:rgba(255,255,255,.92);letter-spacing:-.02em;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.18),transparent 60%)}
.mono small{position:absolute;bottom:12px;font-size:11px;font-weight:600;letter-spacing:.04em;opacity:.75}
.seal{position:absolute;right:10px;bottom:10px;width:76px;height:76px;display:grid;place-items:center;align-content:center;color:#fff;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.35);border-radius:50%;border:3px solid #fff}
.seal b{font-size:28px;line-height:1;font-weight:800;letter-spacing:-.03em}
.seal span{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.seal.g{background:var(--good)}.seal.m{background:var(--mid)}.seal.b{background:var(--bad)}.seal.n{background:#77736b}
.rk{position:absolute;left:10px;top:10px;background:rgba(10,15,30,.78);color:#fff;font-size:12px;font-weight:800;padding:5px 9px;border-radius:999px}
.st8{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.92);color:#0a3161;font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;letter-spacing:.04em}
.fbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:11px;flex:1}
.nameplate .nm{font-weight:800;font-size:19px;line-height:1.15;letter-spacing:-.01em}
.nameplate .pt{color:var(--sub);font-size:13px;margin-top:2px}
.nsw{font-size:12.5px;color:var(--sub);background:var(--none-bg);border-radius:10px;padding:8px 10px}
.credit{font-size:10.5px;color:var(--sub);opacity:.8}
.dot{background-size:cover;background-position:50% 20%;color:#fff;box-shadow:0 0 0 2.5px var(--card),0 0 0 4.5px var(--ring,var(--none))}
.dot.g{--ring:var(--good)}.dot.m{--ring:var(--mid)}.dot.b{--ring:var(--bad)}.dot.n{--ring:var(--none)}
.dot.ph{font-size:0}
.tile .dots{gap:9px;padding:4px}
/* ---------- Deck 1: Old Glory ---------- */
[data-deck="flag"] .face.front{border:0;border-radius:16px;box-shadow:0 0 0 3px #0a3161,var(--shadow)}
[data-deck="flag"] .art{background:#0a3161 radial-gradient(#ffffff55 1.2px,transparent 1.6px) 0 0/18px 18px}
[data-deck="flag"] .seal{border-radius:0;border:0;width:88px;height:88px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);padding-top:10px;box-shadow:none}
[data-deck="flag"] .seal b{font-size:24px}[data-deck="flag"] .seal span{display:none}
[data-deck="flag"] .nameplate{background:#0a3161;color:#fff;margin:-14px -16px 0;padding:12px 16px}
[data-deck="flag"] .nameplate .pt{color:#c9d6ee}
[data-deck="flag"] .fbody{border-bottom:10px solid transparent;border-image:repeating-linear-gradient(90deg,#b22234 0 14px,#fff 14px 28px) 10}
/* ---------- Deck 2: Sunshine State ---------- */
[data-deck="sun"] .face.front{border:0;padding:8px;background:linear-gradient(160deg,#ffb347,#ff5e62 48%,#12a4b6);border-radius:20px}
[data-deck="sun"] .art{border-radius:14px;background:linear-gradient(#ffcf70,#ff7b54 70%,#12a4b6)}
[data-deck="sun"] .art::after{content:"🌴";position:absolute;left:10px;bottom:6px;font-size:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
[data-deck="sun"] .fbody{background:var(--card);border-radius:14px;margin-top:8px}
[data-deck="sun"] .seal{border:0;background-image:repeating-conic-gradient(rgba(255,255,255,.22) 0 10deg,transparent 10deg 20deg);box-shadow:0 0 0 4px #ffd25e,0 4px 14px rgba(0,0,0,.35)}
[data-deck="sun"] .st8{background:#ff8a3d;color:#fff}
[data-deck="sun"] .st8::before{content:"🍊 "}
/* ---------- Deck 3: Capitol Marble ---------- */
[data-deck="marble"] .face.front{border:0;border-radius:6px;padding:7px;background:linear-gradient(115deg,transparent 40%,rgba(120,110,90,.10) 41%,transparent 43%),linear-gradient(60deg,transparent 62%,rgba(120,110,90,.08) 63%,transparent 66%),linear-gradient(135deg,#f8f4ea,#e6dcc7);box-shadow:inset 0 0 0 2px #b8962e,inset 0 0 0 5px #f8f4ea,inset 0 0 0 6px #b8962e,var(--shadow)}
[data-deck="marble"] .art{border-radius:50% 50% 4px 4px/34% 34% 4px 4px;background:#5b4a2c;margin:6px 6px 0;box-shadow:inset 0 0 0 3px #b8962e}
[data-deck="marble"] .fbody{color:#2a2418}
[data-deck="marble"] .nameplate{text-align:center;border-bottom:1px solid #b8962e;padding-bottom:8px}
[data-deck="marble"] .nameplate .nm{font-family:Georgia,"Times New Roman",serif;font-variant:small-caps;font-weight:700;font-size:21px;letter-spacing:.02em}
[data-deck="marble"] .nameplate .pt,[data-deck="marble"] .blurb,[data-deck="marble"] .hintline,[data-deck="marble"] .credit{color:#6a5d45}
[data-deck="marble"] .meter .tr{background:#e1d6bf}
[data-deck="marble"] .seal{border:3px double #f3e2a9;box-shadow:0 0 0 3px #b8962e,0 4px 14px rgba(0,0,0,.3)}

tive; U. of Florida, Georgetown Law (2014); Jones Day; Commerce Dept. counsel (Trump admin, under Wilbur Ross); DeSantis general counsel then chief of staff (Oct 2021-Feb 2025); ran DeSantis's 2024 presidential campaign and the 2024 anti-marijuana-amendment effort.","local_ties":"Grew up in Destin (Panhandle), attended UF; career in Washington and Tallahassee. No residence or Manatee/Palmetto tie found in public records searched. As AG he has acted in the Sarasota area (Sept 2026 letter about a Sarasota County school teacher; Sept 25, 2026 news conference at a Sarasota business).","record":[{"text":"Created a unit investigating companies with China ties; sued Discord and other online platforms over minor safety, is suing OpenAI; says top priority is prosecuting child predators (candidate's stated priorities as reported by WLRN).","url":"https://www.wlrn.org/government-politics/2026-10-23/what-to-know-about-florida-attorney-general-race"},{"text":"Filed a consumer-protection suit against Pfizer and its CEO on Oct 1, 2026 over COVID-19 vaccine marketing claims (allegations in a complaint, untested in court; Pfizer says they are without merit).","url":"https://floridaphoenix.com/2026/10/01/uthmeier-alleges-pfizer-misled-florida-about-its-covid-vaccines-safety/"},{"text":"Credited as the architect of the 'Alligator Alcatraz' Everglades immigration detention site (opened July 1, 2025; reported shut down June 2026); estimated roughly $1 billion in state contracts reported.","url":"https://www.wlrn.org/government-politics/2026-09-03/democrats-want-to-impeach-uthmeier-but-accountability-may-rest-with-the-voters"},{"text":"Sept 21, 2026 letter to Sarasota County School District called for a Pine View School teacher to be fired and her certificate revoked if allegations proved; district's reply said an HR investigation found the allegations 'not supported'; WUSF reported the letter provided no evidence. The student's grandfather is a DeSantis appointee to the State College of Florida Manatee-Sarasota board.","url":"https://www.wusf.org/education/2026-09-30/sarasota-county-school-district-responds-to-attorney-general-uthmeier-teacher-probe"},{"text":"Has threatened local officials (mayors, county commissioners, state attorneys) with removal from office; holds a University of Florida adjunct position reported at $100,000 a year for about two hours of weekly instruction.","url":"https://www.wlrn.org/government-politics/2026-09-03/democrats-want-to-impeach-uthmeier-but-accountability-may-rest-with-the-voters"},{"text":"March 2026: announced reopened state criminal probe of Raul Castro over the 1996 Brothers to the Rescue shootdown; Nov 2025: opened investigation of JPMorgan Chase over Trump Media accounts.","url":"https://en.wikipedia.org/wiki/James_Uthmeier"}],"money_notes":[{"text":"Q1 2026 (through Mar 31): raised $1.91M; $1.62M to political committee Friends of James Uthmeier, $288,843 to personal account; $7.43M cash on hand; $8.26M total across accounts. Named givers: RAI Services Co. (Reynolds American tobacco subsidiary) $100,000; Republican Party of Florida $100,000; 'A Stronger Florida' PC (linked to lobbying firm Rubin Turnbull & Associates) $125,000; Sig Sauer Inc. $50,000 to a political committee (article does not name which); RPOF in-kind staffing/consulting $27,200.","url":"https://www.orlandoweekly.com/news/florida-news/big-tobacco-sig-sauer-and-more-fund-ag-james-uthmeiers-campaign/"},{"text":"Florida Bulldog (Aug 23, 2026) describes his donors as mainly the Republican Party of Florida and industries including sugar, tobacco and builders; war chest about $8.5M.","url":"https://www.floridabulldog.org/2026/08/hope-florida-scandal-overshadowing-ag-uthmeiers-campaign/"},{"text":"Republican Attorneys General Association endorsed him and said it will commit seven figures to the race.","url":"https://legalnewsline.com/florida-record/raga-endorses-uthmeier-in-2026-throws-money-into-campaign/article_f5b092a1-76d8-4ed9-a98e-02b8fe517190.html"},{"text":"Chaired political committee Keep Florida Clean (2024 anti-recreational-marijuana effort); about $8.5M of the Hope Florida $10M passed through two nonprofits to it (see controversies).","url":"https://en.wikipedia.org/wiki/James_Uthmeier"},{"text":"WLRN/Florida Trib reports he accepted thousands of dollars in campaign donations from firms he had hired (reported, not adjudicated).","url":"https://www.wlrn.org/government-politics/2026-09-03/democrats-want-to-impeach-uthmeier-but-accountability-may-rest-with-the-voters"}],"controversies":[{"text":"Hope Florida: in 2024 Centene paid $10M to the Hope Florida Foundation alongside a Medicaid settlement; money then moved through two nonprofits to Keep Florida Clean, a political committee Uthmeier chaired at the time. A Leon County grand jury report (leaked Aug 2026) called it misappropriated and described his committee's role, but indicted no one. On Oct 7, 2026 the 1st District Court of Appeal ordered the report expunged and rejected its finding that the money was diverted; a request for full-court rehearing is pending. No one has been charged.","status":"allegation","url":"https://www.wgcu.org/government-politics/2026-10-07/state-appeals-court-expunges-hope-florida-grand-jury-report"},{"text":"Civil contempt of federal court: on June 17, 2025 U.S. District Judge Kathleen Williams held him in civil contempt for a follow-up letter telling police no order restrained enforcement of immigration law SB 4-C after her April 18, 2025 TRO. Sanction: biweekly reports; no fine or jail. He appealed to the 11th Circuit; I found no reported appeal outcome. The 11th Circuit separately noted his 'seemingly defiant posture' in June 2025.","status":"established","url":"https://floridaphoenix.com/?p=232332"},{"text":"Alligator Alcatraz: Rodriguez alleges no-bid contracts and abuses at the facility (cost cited by Rodriguez: $1.4B and counting). Facility reported closed June 2026. No court finding on contract allegations fou g restrictions.","url":"https://en.wikipedia.org/wiki/Blaise_Ingoglia"},{"text":"Oct 2025: armed agents visited a Vietnam veteran who mailed him a postcard saying 'You lack values'; his office said complaints needed a threat assessment.","url":"https://en.wikipedia.org/wiki/Blaise_Ingoglia"}],"money_notes":[{"text":"Through Jul 27, 2026: $1,187,301 monetary from 927 donors plus $664,491 in-kind (largely $637,412 in-kind consulting/staff from Republican Party of Florida) and $237,950 from 88 political committees. Controls political committees Friends of Blaise Ingoglia (about $6.04M raised since 2021) and Government Gone Wild PAC (about $2.98M since 2017). Figures from a Sparkers Soapbox summary of state filings, not checked against Division of Elections.","url":"https://www.sparkers-soapbox.com/florida-chief-financial-officer-general-election-2026/"},{"text":"TransparencyUSA (undated) lists top contributors including T-Mobile, Publix, Florida Credit Union PAC, U.S. Sugar Corporation, Duke Energy Florida, ICI Homes Residential Holdings ($25,000), Stuart Miller ($25,000).","url":"https://www.transparencyusa.org/fl/candidate/blaise-ingoglia-can"},{"text":"Bradenton Times analysis: committees raised about $10.25M combined, about $5.3M available.","url":"https://thebradentontimes.com/stories/race-analysis-florida-cfo,214084"},{"text":"Self-reported net worth $28.3M (2024 disclosure) rising from $13.7M (2023); homebuilding income.","url":"https://www.floridabulldog.org/2026/08/millions-dollars-real-estate-absent-from-cfo-ingoglia-financial-disclosure/"}],"controversies":[{"text":"Florida Bulldog (Aug 16, 2026): his 2025 Form 6 financial disclosure (filed May 2026) did not individually list 112 properties (55 Hernando, 57 Citrus, est. >$10M) held through four LLCs he manages (Hartland Homes, Hartland Holdings, Hartland Centre, Hartland Plaza). Spokeswoman says form was accurate and attorney-reviewed. As of Sept 25, 2026 no Ethics Commission finding; commission needs a swor e & Investments. Born in Bradenton; FSU B.S. 1978; Palmetto City Council 1988-91; North River Fire District commissioner; Florida House 2010-2018; Senate since 2020. Long-time member of the Senate Banking & Insurance committee.","local_ties":"Born in Bradenton; Senate bio lists spouse from Palmetto and past Palmetto City Council service; family political dynasty (grandfather and uncle served in Florida House/Senate). Lives in Bradenton (Your Observer). District office 717 Manatee Ave W, Bradenton.","record":[{"text":"SB 180 (2025, 'hurricane' bill containing the clause barring local governments in affected counties from adopting more restrictive or burdensome land-development/comp-plan rules and moratoria, sponsor Nick DiCeglie): Boyd voted Yea on Senate passage 4/9/2025 (37-0) and on concurrence 5/2/2025 (34-1; recorded as a Yea cast after roll call). Signed 6/26/2025. Manatee County is among ~25 local governments suing over it.","url":"https://www.flsenate.gov/Session/Bill/2025/180"},{"text":"Vote record PDF for SB 180 Senate passage showing 'Y Boyd-20'.","url":"https://www.flsenate.gov/Session/Bill/2025/180/Vote/SenateVote_s00180c2028.PDF"},{"text":"HB 399 (2026, Land Use and Development Regulations: fee-nexus for permits, as-of-right off-site/manufactured housing, administrative approval for 'large destination resorts', compatibility rules; Chapter 2026-7): Boyd voted Yea on final Senate passage 3/13/2026 (27-11). He voted Nay on Sen. Jones's floor amendment 351666 (failed 17-20). Bradenton Times opinion column calls him a reliable vote in the pro-preemption bloc (opinion).","url":"https://www.flsenate.gov/Session/Bill/2026/399"},{"text":"SB 264 (2023, restricts land purchases by certain foreign-country interests, sponsor Collins): Boyd voted Yea on both the 4/11/2023 Senate passage (38-0) and the 5/4/2023 concurrence (31-8).","url":"https://www.flsenate.gov/Session/Bill/2023/264/Vote/SenateVote_s00264e1056.PDF"},{"text":"Sponsored SB 4-D (2022 special session, ppellate judge has ever lost a retention vote.","judges":[{"name":"Carlos G. Muñiz","text":"Justice since Jan 22, 2019, appointed by Gov. Ron DeSantis (first Nicaraguan-American on the court). Chief Justice July 2022-July 2026. Born Chicago 1969; UVA, Yale Law. Prior jobs: deputy general counsel to Gov. Jeb Bush, Republican Party of Florida policy director, deputy attorney general/chief of staff to AG Pam Bondi, U.S. Education Department general counsel (Trump nominee, confirmed 55-43 in 2018). Had never been a judge before appointment. Only Supreme Court justice on the 2026 ballot.","items":[{"text":"Wrote majority opinion (July 2025, Black Voters Matter v. Byrd) upholding the 2022 congressional map that eliminated a majority-Black north Florida district; Justice Labarga dissented alone.","url":"https://floridatrib.org/2026/10/26/supreme-court-justice-carlos-muniz-22-district-court-judges-face-merit-retention-votes/"},{"text":"Part of the 2024 majorities that let Florida's 6-week abortion ban take effect (state privacy right does not cover abortion) and that allowed the 2024 abortion amendment and recreational marijuana amendment onto the ballot (both fell short of 60%).","url":"https://floridatrib.org/2026/10/26/supreme-court-justice-carlos-muniz-22-district-court-judges-face-merit-retention-votes/"},{"text":"2023 opinion: state regulators did not adequately justify an FPL rate increase; in 2024 publicly called the Public Service Commission a 'black box.'","url":"https://floridatrib.org/2026/10/26/supreme-court-justice-carlos-muniz-22-district-court-judges-face-merit-retention-votes/"},{"text":"Pre-bench: Wikipedia says that in 2013 he took part in discussions that led AG Bondi to take no action on consumer complaints against Trump University; Trump listed him among possible Supreme Court nominees in Sept 2020.","url":"https://en.wikipedia.org/wiki/Carlos_G._Mu%C3%B1iz"}],"owner_sources":[],"owner_sources_searched":["stewpeters.com ?s=Muniz","alexjoneslive.com ?s= -ballard-vie-district-2-090057809.html"}],"money_notes":[{"text":"Official SOE totals: $25,835 monetary through Oct 29, 2026, including $5,000 from himself; no political-committee gifts other than the county Democratic Executive Committee ($1,500). Largest outside givers: Scott and Barbara Brownell ($1,000 each), Gregory L. Patterson PA law firm ($1,000), Jeffrey Trinklein ($1,000). Almost no real-estate or development occupations in the filings (about $500).","url":"https://www.voterfocus.com/CampaignFinance/candidate_pr.php?op=cv&e=212&c=manatee&ca=2499&rellevel=4&committee=N"},{"text":"In the 2022 Democratic primary Charles Smith claimed Bellamy took 'almost $100,000' from developers (Smith's claim; not verified).","url":"https://patch.com/florida/bradenton/charles-b-smith-runs-manatee-county-commission-district-2-seat"}],"controversies":[{"text":"2018: then-Commissioner Charles Smith called for Bellamy to resign as Palmetto Youth Center executive director, saying 'He seldom shows up for work', and said he would not support future funding (the center received about $300,000-$400,000 a year from the children's services tax). Bellamy called the claims 'an unfortunate and false statement'. No finding or resignation was found.","status":"allegation","url":"https://www.athleticbusiness.com/operations/personnel/news/15152996/official-calls-for-youth-center-execs-resignation"}],"foreign_ties":[{"text":"None documented in the public records searched (FARA filings, foreign-government payments, state-owned business, foreign-agent donors)."}],"endorsements":[{"text":"The Bradenton Times recommended Bellamy; the Manatee Democratic Executive Committee gave $1,500.","url":"https://thebradentontimes.com/stories/for-manatee-county-commission-district-6-we-recommend-reggie-bellamy,216731"}],"local_issue_stance":[{"text":"No stated position on the wetland buffer rollback or development found (he left the commission in Nov 2022, before the Oct 2023 rollback vote). His Oct 14, 2026 ation officer and division director in DeSoto County government (parks, library, social services, transit, economic development).","url":"https://www.yourobserver.com/news/2026/apr/07/lakewood-ranch-resident-government-experience-race"},{"text":"No votes cast as an elected official (first run for office).","url":"https://www.tampabaybeacons.com/2026/07/02/republican-candidates-vie-for-manatee-county-commission-district-6/"}],"money_notes":[{"text":"Official SOE totals: $82,051 monetary + $2,406 in-kind through Oct 29, 2026 (largest in the D6 field; Bellamy $25,835). In the itemized export: about $25,125 from business entities, about $10,000 from political committees (about 12%), about $46,900 from individuals.","url":"https://www.voterfocus.com/CampaignFinance/candidate_pr.php?op=cv&e=212&c=manatee&ca=2500&rellevel=4&committee=N"},{"text":"Political committees that gave: Knowledge Is Power ($1,000), Gulf Coast Builders Exchange PC ($1,500), Realtors Political Advocacy / Activity / Action committees ($1,000 each), Keep Florida Moving Forward ($1,000), Focused on Florida's Future PC ($1,000), Christian Family Coalition-Manatee ($1,000), Firefighters and Paramedics PC ($1,000), Shumaker Florida Political Committee ($500).","url":"https://www.voterfocus.com/CampaignFinance/candidate_pr.php?op=cv&e=212&c=manatee&ca=2500&rellevel=4&committee=N"},{"text":"Donors listing a real-estate, property or construction occupation or business type in the filing total about $14,700 (about 17.5% of receipts), e.g. OnPlace LLC, North Lake Communities Inc., McClure Holdings LLC, Orange Park LLC, VB Investments LLC. This is a keyword tally by the researcher, not a legal classification. Poulton told the Beacons she has accepted no money from developers.","url":"https://www.voterfocus.com/CampaignFinance/candidate_pr.php?op=cv&e=212&c=manatee&ca=2500&rellevel=4&committee=N"},{"text":"The Bradenton Times (July) reports ten $1,000 maximum gifts from entities it links, via federal disclosures, ocus.com/CampaignFinance/candidate_pr.php?op=cv&e=212&c=manatee&ca=2476&rellevel=4&committee=N"},{"text":"Committees giving $1,000 each include Hillsborough United, Knowledge Is Power, Florida Courage, six Realtors committees, Christian Family Coalition, Keep Florida Moving Forward, Friends of Mike Rahn PAC, Firefighters and Paramedics, Government Reform & Integrity Task Force PAC (GRIT), Shumaker Florida Political Committee; GrayRobinson PAC $500.","url":"https://www.voterfocus.com/CampaignFinance/candidate_pr.php?op=cv&e=212&c=manatee&ca=2476&rellevel=4&committee=N"},{"text":"GRIT PAC (established July 2026 by a David Ballard; Ballard's county bio names her husband as David, but no source says they are the same person) received $63,500, all from Tallahassee and Ramba-linked committees ($25,000 Committee for Justice, Transportation & Business; $10,500 each from Coalition for Better Care, Greater FL Leadership Group, Voters for Economic Growth) and gave her campaign $1,000.","url":"https://thebradentontimes.com/stories/campaign-finance-reports-display-fundraising-gaps-pac-networks-in-bocc-races,217036"},{"text":"Strong Communities of Southwest Florida PAC (lobbyist David Ramba) received $2.77M from Healthy Progress LLC; listed contributors include Pat Neal, NDC Construction, Benderson Development, Vengroff Investments, One Stop Housing, Blue Sky Communities, Waste Pro, Barrington Group, Rye Associates, North Lake Communities. Its money went to the Republican Party of Florida and, via other PACs, to GRIT and Friends of Mike Rahn PAC, which gave to Ballard.","url":"https://thebradentontimes.com/stories/campaign-finance-reports-display-fundraising-gaps-pac-networks-in-bocc-races,217036"},{"text":"Individual maximum donors include Richard Corcoran, Bill Galvano, Rep. Bill Conerly, Ryan Lieberman (Barrington Group; Suncoast Builders Association president), Mark Vengroff (One Stop Housing), Whiting Preston (farmer and developer behind SeaFlower), Janet Mixon, five Palmett ,["Rick Richards (MYAKKA) BusinessOwner",624,"BusinessOwner"],["MP Markets Samoset LLC (BRADENTON) Owner",500,"Owner"],["Millers Marcite (PALMETTO) Owner",500,"Owner"],["Primo Fresh Market (PALMETTO) Owner",500,"Owner"],["Eileen Jones (PALMETTO) Realtor",500,"Realtor"],["Lace Entertainment LLC (PALMETTO) Owner",500,"Owner"],["MP Markets Samoset LLC (BRADENTON) Owner",500,"Owner"],["Betty Jones (PALMETTO) Retired",300,"Retired"]],"source":"Manatee County Supervisor of Elections campaign reports, pulled Nov 2, 2026","source_url":"https://www.votemanatee.gov/search-financial-reports/"},"score":{"overall":86,"local":{"v":95,"label":"95% of money from Manatee County"},"indep":{"v":62,"label":"38% of all money behind them is big money","parts":["38% of campaign money from businesses, PACs or party"]},"foreign":{"v":100,"reasons":[]}},"rank":2}]},{"kind":"measure","group":"measures","id":"m0","title":"Florida Amendment 1 - Budget Stabilization Fund (rainy-day fund)","short":"Amendment 1","sub":"Rainy-day fund","everyone":true,"scope_note":"every voter","m":{"measure":true,"id":"m0","name":"Florida Amendment 1 - Budget Stabilization Fund (rainy-day fund)","short":"Florida Amendment 1 - Bu","scope":"all","scope_note":"every voter","summary":"Raises the cap on the state's reserve fund from 10% to 25% of the prior year's general revenue and requires the Legislature to deposit up to $750 million a year until the fund reaches the cap (a transfer can be suspended in limited cases, e.g. if money was drawn that year, or once every five years by two-thirds vote). Needs 60%.","who_funds_yes":[{"text":"No political committee or donors found; TaxWatch notes no formal campaign."}],"who_funds_no":[{"text":"No political committee or donors found."}],"supporters":[{"text":"Republican Party of Florida (endorsed); Senate President Ben Albritton; House Speaker Daniel Perez; Florida TaxWatch (yes, 'tough call'); Democratic gubernatorial nominee David Jolly (with guardrails)."}],"opponents":[{"text":"Gov. Ron DeSantis ('foolish'); Byron Donalds campaign spokesperson; House Democratic Leader Fentrice Driskell; Miami-Dade and Palm Beach County Democratic parties."}],"fiscal":[{"text":"Required deposits of $750M a year; current maximum about $5B. Florida TaxWatch estimates the fund could reach the cap around 2049 at 2.4% revenue growth (about $16.4B tied up) and might never reach it at 3% growth. No local-government revenue loss. The Legislature passed it 100-1 (House) and 29-4 (Senate)."}],"owner_sources":[],"urls":["https://floridataxwatch.org/the-florida-taxpayers-guide-for-the-2026-constitutional-amendments/","https://www.wlrn.org/government-politics/2026-10-15/what-florida-voters-need-to-know-about-amendments-1-and-2","https://www.news4jax.com/vote-2026/2026/10/27/floridas-3-statewide-amendments-heres-what-your-yes-or-no-vote-would-do/"]}},{"kind":"measure","group":"measures","id":"m1","title":"Florida Amendment 2 - Agricultural tangible personal property tax exemption","short":"Amendment 2","sub":"Farm equipment tax break","everyone":true,"scope_note":"every voter","m":{"measure":true,"id":"m1","name":"Florida Amendment 2 - Agricultural tangible personal property tax exemption","short":"Florida Amendment 2 - Ag","scope":"all","scope_note":"every voter","summary":"Exempts machinery, equipment and tools (not land or buildings) used on agricultural land or in agritourism from property tax, beginning tax year 2027; the Legislature sets details. Businesses, including farms, already get a $25,000 tangible-property exemption. Needs 60%.","who_funds_yes":[{"text":"No political committee or donors found."}],"who_funds_no":[{"text":"No political committee or donors found."}],"supporters":[{"text":"Sen. Keith Truenow and Rep. Danny Alvarez (sponsors); Agriculture Commissioner Wilton Simpson; Florida Farm Bureau; Florida TaxWatch (yes)."}],"opponents":[{"text":"Rep. Anna Eskamani (lone House no); Hillsborough County Democratic Party; critics say the biggest benefit goes to operations with the most equipment and that local services lose revenue."}],"fiscal":[{"text":"Legislative estimate: about $31.0M less local property-tax revenue in FY2027-28, $32.3M the next year, $33.6M the year after (statewide; larger relative impact on small rural counties). Passed 110-1 (House) and unanimously (Senate)."}],"owner_sources":[],"urls":["https://floridataxwatch.org/the-florida-taxpayers-guide-for-the-2026-constitutional-amendments/","https://www.wlrn.org/government-politics/2026-10-15/what-florida-voters-need-to-know-about-amendments-1-and-2"]}},{"kind":"measure","group":"measures","id":"m2","title":"Florida Amendment 3 - Homestead exemption increase and limits on local property-tax spending ('Save Our Homes From Excessive Property Taxes')","short":"Amendment 3","sub":"Homestead tax cut","everyone":true,"scope_note":"every voter","m":{"measure":true,"id":"m2","name":"Florida Amendment 3 - Homestead exemption increase and limits on local property-tax spending ('Save Our Homes From Excessive Property Taxes')","short":"Florida Amendment 3 - Ho","scope":"all","scope_note":"every voter","summary":"Raises the non-school homestead exemption to $150,000 in 2027 and $250,000 in 2028 (inflation-indexed after), lets local governments raise it further, cuts the yearly assessment-growth cap for non-homestead property from 10% to 5% (non-school), makes people who establish Florida residency after Dec 31, 2026 wait five years for the full exemption, and limits what local governments may spend property-tax revenue on. School taxes are excluded. Needs 60%; takes effect Jan 1, 2027.","who_funds_yes":[{"text":"'Vote Yes on 3' committee, funded almost entirely by Florida Realtors: $18M reported in September (WPTV); search results report more than $21.5M by Oct 9 including about $2M from the National Association of Realtors (not independently opened)."}],"who_funds_no":[{"text":"Two committees, including Floridians for Shared Prosperity, raised a combined $680,000 per WPTV; donors were not itemized in the sources."}],"supporters":[{"text":"Gov. Ron DeSantis, Sen. Rick Scott, CFO Blaise Ingoglia, Florida Realtors, Republican leadership. Locally, Poulton says she supports it."}],"opponents":[{"text":"Florida Fraternal Order of Police, Florida Sheriffs Association, Florida Professional Firefighters, Florida Association of Counties, Florida League of Cities, 1000 Friends of Florida, Sierra Club, Florida Policy Institute, Polk Sheriff Grady Judd, Florida TaxWatch (recommends no). Manatee Commissioner George Kruse criticizes the lack of an implementation plan."}],"fiscal":[{"text":"State Revenue Estimating Conference: local property-tax revenue falls $4.94B in 2027, $8.71B in 2028 and $11.84B by 2031 ($45.8B over five years); average homestead saving about $1,035 in 2027 and $2,085 in 2028. Manatee County: REC-based estimate of nearly $68M (FY2027-28) and $127.5M (FY2028-29); City of Palmetto $1.39M and Bradenton $5.2M in FY2027-28 (as reported by Tampa Bay Beacons). A Florida Policy Institute calculator figure of about $212M for Manatee in year one was reported secondhand and could not be confirmed. Sheriff Rick Wells: about $23M cut to his budget in year one and $50M total by year two. County baseline per staff (Feb 2026, secondhand): FY2026 general fund about $645M, property taxes about $327M."}],"owner_sources":[],"urls":["https://floridataxwatch.org/the-florida-taxpayers-guide-for-the-2026-constitutional-amendments/","https://www.tampabaybeacons.com/2026/07/27/cities-group-to-voters-no-on-3/","https://www.mysuncoast.com/2026/10/19/property-tax-amendment-could-cut-manatee-county-public-safety-budget/","https://www.wptv.com/wptv-investigates/amendment-3-supporters-outspent-opponents-26-to-1-as-florida-realtors-poured-18-million-into-the-race","https://www.floridapolicy.org/posts/florida-property-tax-amendment-ballot-language-summary?759aefbb_page=16","https://www.news4jax.com/vote-2026/2026/10/27/floridas-3-statewide-amendments-heres-what-your-yes-or-no-vote-would-do/"]}},{"kind":"measure","group":"measures","id":"m3","title":"Manatee County Water Quality Protection, Overdevelopment Prevention, Natural Lands Preservation and Public Preserves General Obligation Bonds ($75M, 0.16 mill)","short":"County land bond","sub":"$75M water & land","everyone":true,"scope_note":"every voter","m":{"measure":true,"id":"m3","name":"Manatee County Water Quality Protection, Overdevelopment Prevention, Natural Lands Preservation and Public Preserves General Obligation Bonds ($75M, 0.16 mill)","short":"Manatee County Water Qua","scope":"all","scope_note":"every voter","summary":"Authorizes the county to levy an added 0.16 mill property tax and issue up to $75M in general obligation bonds (20-year maturity, annual audits) to buy, improve and maintain environmental lands and conservation easements (including farmland development rights) that protect drinking water and water quality. It sits on top of the 2020 measure (0.15 mill, $50M cap, passed with about 71%). A no vote ends the program per the county natural-resources director; land already protected stays protected.","who_funds_yes":[{"text":"Political committee 'Protect Water, Preserve Land': $45,050 monetary + $8,926 in-kind per the Supervisor of Elections; donors Florida Wildlife Corridor Foundation $22,500, Trust for Public Land about $15,800, NCDG Management LLC (Sarasota; business not named in the filing) $10,000, and individuals; spending went mainly to Simmer House (Fort Myers) for marketing."}],"who_funds_no":[{"text":"No organized opposition committee found; opposition is individual voters (e.g. Trent Wayman) citing cost of living and distrust of county handling of funds."}],"supporters":[{"text":"Commissioners Mike Rahn and Tal Siddique (Siddique expects Amendment 3 supporters to back it); Conservation Florida; Keep Manatee Beautiful; Big Water Trust; League of Women Voters of Manatee County (supports, demands oversight fixes)."}],"opponen const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const band = v => v == null ? "n" : v >= 70 ? "g" : v >= 45 ? "m" : "b";

function initials(n) {
  const w = n.replace(/".*?"|\(.*?\)/g, "").replace(/\b(Jr|Sr|III|II)\b\.?/g, "").trim().split(/\s+/).filter(Boolean);
  return ((w[0] || "?")[0] + (w.length > 1 ? w[w.length - 1][0] : "")).toUpperCase();
}
const link = (u, t) => u ? ` <a href="${esc(u)}" target="_blank" rel="noopener">${esc(t || "source")} ↗</a>` : "";
function firstSentence(s, max = 170) {
  s = String(s || "");
  const m = s.match(/^.{50,}?[a-z]{4}[.;](?=\s|$)/);
  const out = m && m[0].length <= max ? m[0] : s.slice(0, max);
  return out.length < s.length && !/[.;]$/.test(out) ? out.replace(/\s+\S*$/, "") + "…" : out;
}
const raceById = id => D.races.find(r => r.id === id);

// Election Day box. Facts from votemanatee.gov (polling locations + vote-by-mail pages), checked 2026-11-03.
const ELECTION = "2026-11-03";
function pollStatus() {
  const et = new Date(new Date().toLocaleString("en-US", {timeZone: "America/New_York"}));
  const day = et.getFullYear() + "-" + String(et.getMonth() + 1).padStart(2, "0") + "-" + String(et.getDate()).padStart(2, "0");
  if (day < ELECTION) return ["", "Polls are open 7 am – 7 pm on Election Day"];
  if (day > ELECTION) return ["closed", "Election Day was Tuesday, Nov 3"];
  const mins = et.getHours() * 60 + et.getMinutes();
  if (mins < 420) return ["", "Polls open at 7 am today"];
  if (mins >= 1140) return ["closed", "Polls closed at 7 pm. If you were in line by 7, you can still vote."];
  const left = 1140 - mins;
  return ["open", `Polls are open now · close in ${Math.floor(left / 60)}h ${left % 60}m (7 pm)`];
}
function voteBox() {
  const [cls, txt] = pollStatus();
  return `<section class="vote" aria-label="Voting today">
    <div class="vh"><span class="vi">🗳️</span><div><b>Election Day · Tuesday, Nov 3</b><span class="${cls}" id="pollst">${esc(txt)}</span></div></div>

    <form class="zip" id="zipf" autocomplete="off"><label for="zipi">Check your ZIP</label><input id="zipi" inputmode="numeric" maxlength="5" placeholder="34221" aria-describedby="zipo"></form>
    <p class="zipout" id="zipo" aria-live="polite"></p>

}
function zipAnswer(z) {
  if (!/^\d{5}$/.test(z)) return "";
  if (z === "34221") return "✅ This guide is built for 34221. A few district races depend on your street, so the tiles marked “Some addresses” may not be yours. “My exact ballot” confirms it.";
  if (/^3(2|3|4)\d{3}$/.test(z)) return "Your statewide races are the same as here: Governor, U.S. Senate, Attorney General, CFO, Agriculture, and the three amendments. Your district and local races may be different, so use “My exact ballot” for your full list. (The ZIP stays on your phone and isn't sent anywhere.)";
  return "This guide covers Palmetto, Florida 34221. Look up your own ballot with your county's elections office.";
}

function card(r, c, i) {
  const s = c.score, b = band(s.overall), m = c.money || {};

  const forAmt = out.filter(o => o[1] === "S").reduce((a, o) => a + +o[2], 0);
  const agAmt = out.filter(o => o[1] === "O").reduce((a, o) => a + +o[2], 0);
  const front = `
    <div class="face front f${b}">
      <div class="art">${art(c)}
        ${c.rank ? `<div class="rk">#${c.rank} of ${total}</div>` : ""}<div class="st8">FL</div>
        <div class="seal ${b}"><b>${s.overall ?? "—"}</b><span>${WORD[b]}</span></div></div>
      <div class="fbody">
        <div class="nameplate"><div class="nm">${esc(c.name)}</div><div class="pt">${partyName(c.party)}${c.incumbent ? " · Incumbent" : ""}${c.running_mate ? " · with " + esc(c.running_mate) : ""}</div></div>
        ${s.overall == null ? `<div class="nsw">${esc(s.why)}</div>` : ""}
        <div>${meter("🏠", "Local", s.local)}${meter("🗽", "Country first", s.foreign)}${meter("💵", "Independent", s.indep)}</div>
        <p class="blurb">${esc(firstSentence(c.bio).replace(/;$/, "."))}</p>
        <div class="badges">${srcHits(c) ? `<span class="bdg src">📣 In your sources (${srcHits(c)})</span>` : ""}${f.length ? `<span class="bdg flag">⚠ ${f.length} on record</span>` : ""}</div>
        <div class="hintline">Tap to flip ↻${c.photo ? ` <span class="credit">· Photo: ${esc(c.photo.credit)}</span>` : ""}</div>
      </div>
    </div>`;
  const top = (m.top || []).slice(0, 3).map(t => `<li>${esc(t[0])} — <b>${usd(t[1])}</b></li>`).join("");
  const ct = (m.committee && m.committee.top || [])[0];
  const comm = m.committee && m.committee.total ? `<p class="mini">➕ <b>${usd(m.committee.total)}</b> more in <b>${esc(m.committee.name)}</b>, a committee they control with no donation limit${ct ? `. Biggest: ${esc(ct[0])} ${usd(ct[1])}` : ""}.</p>` : "";
  const fr = s.foreign.reasons.length ? s.foreign.reasons.map(x => `−${x.pts} · ${esc(x.text)}`).join("<br>") : "No foreign-connected money or ties found.";
  const back = `
    <div class="face back f${b}">
      <p class="bk">💵 The money</p>
      <div class="kv"><div><b>${usd(m.raised)}</b><span>raised</span></div><div><b>${s.local && s.local.v != null ? s.local.v + "%" : "—"}</b><span>from home</span></div><div><b>${pct(m.out_pct)}</b><span>out of state</span></div></div>
      ${comm}
      ${top ? `<div><div class="mini"><b>Biggest givers</b></div><ol class="top3">${top}</ol></div>` : `<p class="mini muted">No itemized givers on file.</p>`}
      ${forAmt || agAmt ? `<p class="mini">📢 Outside groups spent <b>${usd(forAmt)}</b> to help and <b>${usd(agAmt)}</b> to hurt them.</p>` : ""}
      <p class="bk">🗽 Foreign</p><p class="mini">${fr}</p>
      ${f.length ? `<p class="bk">⚠ On record</p>` + f.slice(0, 1).map(x => `<p class="mini"><span class="st ${esc(x.status || "")}">${esc(x.status || "note")}</span>${esc(firstSentence(x.text, 150))}</p>`).join("") : ""}
      ${srcHits(c) ? `<div class="own" style="margin:0;padding:8px 10px"><b style="color:var(--amber)">📣 Your sources:</b> <span class="mini">${esc(c.owner_sources[0].title)}${srcHits(c) > 1 ? ` <b>+ ${srcHits(c) - 1} more</b>` : ""}</span></div>` : ""}
      <div class="row2"><button class="btn" data-prof="${r.id}|${i}">Full profile</button><button class="btn ghost" data-flipback aria-label="Flip back">↻</button></div>
    </div>`;
  return `<div class="flip band-${b}" tabindex="0" role="button" aria-label="${esc(c.name)}: score ${s.overall ?? "not scored"}. Press to flip."><div class="in">${front}${back}</div></div>`;
}

function profile(r, c) {
  const s = c.score, m = c.money || {}, b = band(s.overall);
  const T = rows => `<table class="t">${rows.map(t => `<tr><td>${esc(t[0])}${t[2] ? `<div class="mini muted">${esc(t[2])}</div>` : ""}</td><td class="r">${usd(+t[1])}</td></tr>`).join("")}</table>`;
  let h = `<div class="big bg-${b}" style="margin-bottom:10px"><div class="num">${s.overall ?? "—"}</div><div><div class="word">${WORD[b]} · ${esc(r.short)}</div><div class="hint">${partyName(c.party)}${c.incumbent ? " · Incumbent" : ""}${c.rank ? " · ranked #" + c.rank + " of " + r.cands.filter(x => x.rank).length : ""}</div></div></div>`;
  h += `<div class="panel">${meter("🏠", "Local", s.local)}<div class="mini muted" style="margin:0 0 10px">${esc(s.local ? s.local.label : s.why)}</div>
    ${meter("🗽", "Country first", s.foreign)}<div class="mini muted" style="margin:0 0 10px">${s.foreign.reasons.length ? s.foreign.reasons.map(x => `−${x.pts}: ${esc(x.text)}${link(x.url)}`).join("<br>") : "Nothing found that lowers this."}</div>
    ${meter("💵", "Independent", s.indep)}<div class="mini muted">${s.indep ? esc(s.indep.label) + ": " + s.indep.parts.map(esc).join("; ") + "." : esc(s.why)}</div></div>`;
  h += `<div class="panel"><h4>Who they are</h4>${esc(c.bio || "")}${c.running_mate ? `<p class="mini" style="margin-top:8px"><b>Running mate:</b> ${esc(c.running_mate)}</p>` : ""}${c.local_ties ? `<p class="mini" style="margin-top:8px"><b>🏠 Local ties:</b> ${esc(c.local_ties)}</p>` : ""}</div>`;
  h += ownBox(c.owner_sources, c.owner_sources_searched);
  let mh = `<div class="kv" style="margin:2px 0 10px"><div><b>${usd(m.raised)}</b><span>raised</span></div><div><b>${pct(m.fl_pct)}</b><span>from Florida</span></div><div><b>${pct(m.out_pct)}</b><span>out of state</span></div><div><b>${pct(m.local_pct)}</b><span>${m.local_label ? "Sarasota–Manatee" : "Manatee County"}</span></div><div><b>${pct(m.org_pct)}</b><span>business / PAC</span></div><div><b>${pct(m.build_land_pct)}</b><span>building & land</span></div></div>`;
  if (m.loans) mh += `<p class="mini">Loans (often the candidate's own money): <b>${usd(m.loans)}</b></p>`;
  if (m.committee) mh += `<p class="mini" style="margin-top:10px"><b>${esc(m.committee.name)}</b>: ${usd(m.committee.total)} (${esc(m.committee.span || "")}), no donation limit.</p>${T(m.committee.top || [])}`;
  if ((m.top || []).length) mh += `<p class="mini" style="margin-top:12px"><b>Biggest givers to the campaign</b></p>${T(m.top)}`;
  if ((m.groups || []).length) mh += `<p class="mini" style="margin-top:12px"><b>Several companies at one address</b> (each can give the limit)</p>` + m.groups.map(g => `<p class="mini">• ${esc(g[0])}: <b>${usd(g[1])}</b> from ${g[2].length} entities (${esc(g[2].slice(0, 4).join(", "))}${g[2].length > 4 ? "…" : ""})</p>`).join("");
  if ((m.pacs || []).length) mh += `<p class="mini" style="margin-top:12px"><b>PAC checks</b></p>${T(m.pacs)}`;
  if ((m.outside || []).length) mh += `<p class="mini" style="margin-top:12px"><b>Outside groups</b></p><table class="t">${m.outside.map(o => `<tr><td>${esc(o[0])}</td><td>${o[1] === "S" ? "to help" : "to hurt"}</td><td class="r">${usd(+o[2])}</td></tr>`).join("")}</table>`;
  if (m.note) mh += `<p class="mini muted" style="margin-top:10px">${esc(m.note)}</p>`;
  if (m.source) mh += `<p class="mini muted">${esc(m.source)}${link(m.source_url)}</p>`;
  h += `<details open><summary>💵 Money</summary>${mh}</details>`;
  h += list("💬 Money in the news", c.money_notes, li);
  h += list("⚠ Cases, complaints & controversies", c.controversies, x => `<li><span class="st ${esc(x.status || "")}">${esc(x.status || "note")}</span>${esc(x.text)}${link(x.url)}</li>`);
  h += list("🗽 Foreign ties", c.foreign_ties, li);
  h += list("📋 Record", c.record, li);
  h += list("🏡 Local issues", c.local_issue_stance, li);
  h += list("🤝 Endorsements", c.endorsements, li);
  h += list("📰 What newspapers said (opinion)", c.press_opinion, li);
  if (c.gaps) h += `<div class="panel"><h4>What we couldn't find</h4>${esc(c.gaps)}</div>`;
  return h;
}

function howSheet() {
  const R = D.rules;
  return `<div class="panel">Each candidate gets three meters from 0 to 100, one for each of your questions. The big number is their average. It comes from public filings only: never party, views, votes or anyone's opinion.
      <div class="legend"><span><i class="g"></i>70+ Strong</span><span><i class="m"></i>45–69 Mixed</span><span><i class="b"></i>Under 45 Weak</span><span><i class="n"></i>Not scored</span></div></div>
    <div class="panel"><h4>🏠 Local: commitment to the area</h4>The share of their money that comes from home. “Home” fits the office: Florida for statewide and U.S. Senate races; Sarasota–Manatee zip codes for U.S. House 16; Manatee, Sarasota and Hillsborough zip codes for the State House and Senate; Manatee County for county and city races.</div>
    <div class="panel"><h4>🗽 Country first: foreign interest</h4>Starts at 100. Points come off for each documented item:<ul class="formula">${R.foreign.map(f => `<li>−${f.pts}: ${esc(f.text)}</li>`).join("")}<li>−${R.pac} per check from the U.S. PAC of a foreign-parent company (legal; funded by U.S. employees)</li></ul>Trips, statements and votes are listed on the profile but don't change the score.</div>
    <div class="panel"><h4>💵 Independent: big donors</h4>100 minus the share of all the money behind them that is big money. Big money means business, PAC and party money; for federal races, individuals giving $2,000+; any political committee the candidate controls (no donation limit in Florida); and money outside groups spent to help them.</div>
    <div class="panel"><h4>Limits</h4>Candidates who raised very little aren't scored, because a few checks would swing everything: under $${R.min.federal.toLocaleString()} for federal and statewide offices, $${R.min.legislature.toLocaleString()} for the Legislature, $${R.min.local.toLocaleString()} for county and city. Federal donor detail runs through about July 2026. Filings miss dark money, family money and promises. A donation is a fact about the donor, not proof of what a candidate will do.</div>`;
}

function srcSheet() {
  const hits = [], none = [];
  for (const r of D.races) for (const c of (r.cands || [])) (srcHits(c) ? hits : none).push([r, c]);
  const mHits = D.races.filter(r => r.kind === "measure" && (r.m.owner_sources || []).length);
  return `<div class="panel">Your five sources (<b>rumble.com/Owen</b>, <b>alexjoneslive.com</b>, <b>rumble.com/TheAlexJonesShowLive</b>, <b>rumble.com/c/StewPeters</b>, <b>stewpeters.com</b>) were searched for every candidate and ballot question here. What they say appears in an amber 📣 box on that candidate's card, credited to them and reported as they say it. Only headlines and descriptions could be read; videos can't be watched. They don't change the scores.</div>
    <h3 style="margin:18px 2px 6px">Found something (${hits.length + mHits.length})</h3>
    ${hits.map(([r, c]) => `<div class="panel"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1">${esc(c.name)} · ${esc(r.short)}</b><button class="btn ghost" style="padding:7px 12px" data-prof="${r.id}|${r.cands.indexOf(c)}">Open card</button></div>${ownBox(c.owner_sources)}</div>`).join("")}
    ${mHits.map(r => `<div class="panel"><b>${esc(r.short)}</b>${ownBox(r.m.owner_sources)}</div>`).join("")}
    <h3 style="margin:18px 2px 6px">Searched, nothing found (${none.length})</h3><div class="panel mini">${none.map(([r, c]) => esc(c.name)).join(" · ")}</div>`;
}

const aboutSheet = () => D.boxes.map(b => `<div class="panel"><h4>${esc(b.title)}</h4>${b.html}</div>`).join("") + `<div class="panel">${D.footer}</div>`;

function openSheet(title, body) {
  $("#shT").textContent = title; $("#shB").innerHTML = body;
  $("#sheet").classList.add("open"); $("#sheet").setAttribute("aria-hidden", "false"); document.body.classList.add("locked");
  $("#sheet .pn").scrollTop = 0;
}
function closeSheet() { $("#sheet").classList.remove("open"); $("#sheet").setAttribute("aria-hidden", "true"); document.body.classList.remove("locked"); }

let shownPage = null;
function route() {
  const [page, sub] = decodeURIComponent(location.hash.slice(1)).split("/");
  const r = raceById(page);
  if (page !== shownPage) { r ? racePage(r) : home(); shownPage = r ? page : ""; window.scrollTo(0, 0); }
  if (sub === "how") openSheet("How scores work", howSheet());
  else if (sub === "src") openSheet("Your sources", srcSheet());
  else if (sub === "about") openSheet("About this report", aboutSheet());
  else if (sub && sub[0] === "p") {
    const [rid, i] = sub.slice(1).split("|"), pr = raceById(rid), c = pr && pr.cands && pr.cands[+i];
    c ? openSheet(c.name, profile(pr, c)) : closeSheet();
  } else closeSheet();
}
const curPage = () => decodeURIComponent(location.hash.slice(1)).split("/")[0];
document.addEventListener("click", e => {
  const t = e.target;
  const go = t.closest("[data-go]");
  if (go) { location.hash = go.dataset.go; return; }
  const sh = t.closest("[data-sheet]");
  if (sh) { location.hash = curPage() + "/" + sh.dataset.sheet; return; }
  const pf = t.closest("[data-prof]");
  if (pf) { location.hash = curPage() + "/p" + pf.dataset.prof; return; }
  if (t.closest("[data-close]")) { location.hash = curPage(); return; }
  const dk = t.closest(".dk");
  if (dk) { setDeck(dk.dataset.deck); return; }
  if (t.closest("a")) return;
  const fl = t.closest(".flip");
  if (fl) fl.classList.toggle("on");
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#sheet").classList.contains("open")) { location.hash = curPage(); return; }
  const fl = e.target.closest && e.target.closest(".flip");
  if (fl && e.target === fl && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); fl.classList.toggle("on"); }
});
document.addEventListener("input", e => {
  if (e.target.id !== "zipi") return;
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 5);
  $("#zipo").textContent = zipAnswer(e.target.value);
});
document.addEventListener("submit", e => { if (e.target.id === "zipf") e.preventDefault(); });
setInterval(() => { const el = $("#pollst"); if (el) { const [c, t] = pollStatus(); el.className = c; el.textContent = t; } }, 30000);
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
